<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SNOWLINE — симулятор горнолыжного курорта</title>
<style>
  *{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#091726}body{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#eef6ff}
  #snowline{--muted:#99b4cc;--outline:#29445b;--teal:#6af2d7;max-width:1240px;margin:auto;padding:25px 22px 35px}
  #snowline button{font:inherit;cursor:pointer}#snowline button:focus-visible{outline:2px solid var(--teal);outline-offset:3px}
  .top{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:22px}
  .brand{display:flex;align-items:center;gap:12px}.logo{height:49px;width:49px;border-radius:16px;background:linear-gradient(135deg,#4adfc6,#388ddd);display:grid;place-items:center;box-shadow:0 6px 22px #15c0d438;font-size:28px}
  .brand-name{font-size:24px;font-weight:850;letter-spacing:1.6px}.brand-sub{font-size:12px;color:var(--muted);margin-top:2px}
  .pill{background:#143044;border:1px solid #31516a;border-radius:999px;padding:9px 14px;color:#c9e1f5;font-size:13px;font-weight:700}
  .stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;margin-bottom:17px}
  .stat{border:1px solid var(--outline);background:#10283d;border-radius:16px;padding:14px 14px 12px;min-height:83px}.stat-label{font-size:11px;color:var(--muted);margin-bottom:9px}.stat-value{font-size:22px;font-weight:800;white-space:nowrap;letter-spacing:-.5px}.stat-hint{font-size:11px;color:#9dd7b9;margin-top:3px}
  .layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(295px,1fr);gap:17px}
  .panel{background:#10283d;border:1px solid var(--outline);border-radius:19px;overflow:hidden}
  .panel-h{display:flex;justify-content:space-between;align-items:center;gap:9px;padding:17px 18px 12px}.panel-title{font-weight:800;font-size:17px}.eyebrow{font-size:11px;color:var(--muted);margin-top:4px}.small-tag{font-size:11px;color:#b3f5eb;background:#193f4f;border:1px solid #2f686f;border-radius:20px;padding:6px 9px;white-space:nowrap}
  .mountain{position:relative;overflow:hidden;background:linear-gradient(#79b7dd 0%,#c1e5f8 37%,#ebf6fa 38%,#f5fbff 100%);padding:15px 13px 11px;min-height:455px}
  .mountain:before{content:"";position:absolute;left:-6%;right:-6%;top:1%;height:49%;background:#cde3ed;clip-path:polygon(0% 80%,13% 47%,22% 71%,36% 8%,47% 55%,61% 24%,75% 65%,87% 29%,100% 72%,100% 100%,0 100%);opacity:.95}
  .mountain:after{content:"";position:absolute;left:-6%;right:-6%;top:8%;height:51%;background:#f4fbff;clip-path:polygon(0 84%,14% 53%,23% 73%,36% 0,48% 66%,62% 22%,75% 71%,87% 37%,100% 78%,100% 100%,0 100%);opacity:.85}
  .map-grid{position:relative;z-index:1;display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:4px;max-width:570px;margin:25px auto 0;transform:perspective(1000px) rotateX(3deg)}
  .tile{aspect-ratio:1/1;border:1px solid #9bc0d2b3;border-radius:9px;background:linear-gradient(145deg,#f8fcffdd,#bfdeeece);padding:0;display:flex;justify-content:center;align-items:center;position:relative;transition:transform .13s,box-shadow .13s,border-color .13s;box-shadow:0 2px 3px #2d60731c;min-width:0}
  .tile:hover:not(:disabled){transform:translateY(-3px);box-shadow:0 3px 12px #186a8a66;border-color:#0791a9;z-index:3}
  .tile.ridge{background:linear-gradient(145deg,#f9fdff,#adcad7);border-color:#b0cbd8}.tile.rock{background:linear-gradient(125deg,#8babb7,#c6d5da);border-color:#8da8b4;cursor:not-allowed}.tile.base{background:linear-gradient(135deg,#dff6f4,#a1d1c8);border-color:#85bcb6}
  .tile.built{background:linear-gradient(135deg,#ffffff,#bbdff2);border:2px solid #509db3}.tile.built.lodge{background:linear-gradient(135deg,#e6fff1,#99d9b9);border-color:#38a477}
  .tile.selected-buildable{box-shadow:inset 0 0 0 1px #ffffff6e}.tile .tile-icon{font-size:clamp(18px,2.8vw,30px);filter:drop-shadow(0 2px 1px #365b7033)}.tile .base-mark{font-size:14px;opacity:.48}.tile .tile-num{position:absolute;right:3px;bottom:2px;font-size:8px;color:#2f627c;font-weight:800}
  .tile.blue .tile-icon,.tile.red .tile-icon{position:absolute;left:5px;top:4px;font-size:10px;z-index:2}.ski-run{position:absolute;inset:2px;border-radius:6px;overflow:hidden;pointer-events:none;z-index:1}.skier{--start:18%;--middle:53%;--finish:77%;--duration:3.6s;position:absolute;top:-24%;left:var(--start);width:9px;height:13px;filter:drop-shadow(0 1px 1px #31526988);animation:ski-down var(--duration) linear infinite;animation-delay:var(--delay);will-change:top,left,transform}.skier::before{content:"";position:absolute;left:3px;top:0;width:4px;height:4px;border-radius:50%;background:#f1b784;box-shadow:0 -1px 0 #173e5c}.skier::after{content:"";position:absolute;left:-1px;bottom:0;width:13px;height:2px;border-radius:3px;background:linear-gradient(90deg,#1b5d87 0 45%,transparent 45% 55%,#1b5d87 55%);transform:rotate(17deg)}.skier-body{position:absolute;left:2px;top:4px;width:6px;height:7px;border-radius:3px 3px 2px 2px;background:#27a9d6;transform:rotate(-13deg)}.tile.red .skier-body{background:#ed5264}.skier-body::after{content:"";position:absolute;width:8px;height:1px;background:#315269;left:-1px;top:4px;transform:rotate(35deg);transform-origin:center}.skier:nth-child(2){--start:72%;--middle:42%;--finish:21%;--duration:4.3s;transform:scale(.88)}
  @keyframes ski-down{0%{top:-24%;left:var(--start);transform:rotate(7deg)}42%{left:var(--middle);transform:rotate(-8deg)}72%{left:var(--finish);transform:rotate(10deg)}100%{top:112%;left:44%;transform:rotate(-5deg)}}
  @media(prefers-reduced-motion:reduce){.skier{animation-duration:8s}}
  .map-foot{position:relative;z-index:2;display:flex;justify-content:space-between;gap:6px;margin-top:20px;color:#3c6b80;font-size:11px;font-weight:750;padding:0 4px}.map-foot span{background:#eefaffbd;border-radius:20px;padding:5px 8px}
  .action-area{padding:15px;border-top:1px solid #29485d}.instruction{font-size:13px;color:#d4e7f6;line-height:1.45;margin-bottom:12px}
  .button-primary{width:100%;border:0;border-radius:12px;background:linear-gradient(110deg,#56e2c7,#49b4e9);color:#082434;font-weight:900!important;padding:13px 15px;box-shadow:0 7px 17px #0fc9c13f}.button-primary:hover{filter:brightness(1.07)}
  .shop{padding:4px 14px 12px}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{display:flex;text-align:left;align-items:center;gap:9px;color:#e9f6ff;border-radius:12px;border:1px solid #31526b;background:#183449;padding:11px 9px;min-height:70px}.tool:hover{background:#214660}.tool.chosen{border-color:#5cf1d5;background:#164a55;box-shadow:inset 0 0 0 1px #45c1b0}.tool:disabled{opacity:.4;cursor:not-allowed}.tool-icon{font-size:25px;min-width:29px}.tool-title{font-size:12px;font-weight:800;line-height:1.3}.tool-cost{font-size:11px;color:#aec9dc;margin-top:4px}
  .hint{font-size:12px;line-height:1.5;color:#abc7db;border-top:1px solid #29465c;margin:1px 14px 0;padding:11px 2px}.hint b{color:#c6f8ec}
  .subpanel{margin:12px 14px 0;padding:13px;background:#0c2133;border-radius:14px;border:1px solid #2a4358}.subheading{font-size:12px;color:#a4c6da;font-weight:800;text-transform:uppercase;letter-spacing:.55px}.ticket{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-top:9px}.ticket-value{font-size:21px;font-weight:850}.stepper{display:flex;align-items:center;gap:7px}.stepper button{width:32px;height:31px;border-radius:9px;border:1px solid #365e73;color:white;background:#244b60;font-size:19px}.stepper button:hover{background:#33647b}
  .mission{display:flex;align-items:center;justify-content:space-between;gap:9px}.mission-copy{font-size:12px;color:#c4dce9;line-height:1.55}.progress{height:7px;border-radius:20px;overflow:hidden;background:#25485a;margin-top:9px}.progress>div{height:100%;background:linear-gradient(90deg,#35abc2,#6af2cf);border-radius:10px;transition:width .25s}
  .feed{margin-top:16px;border-top:1px solid #2b4960;padding:13px 16px 14px}.feed-title{font-size:12px;font-weight:800;color:#b1cadd;margin-bottom:9px}.feed-row{font-size:12px;color:#d6e4f0;line-height:1.4;padding:8px 0;border-bottom:1px solid #28445a}.feed-row:last-child{border-bottom:0}.feed-row strong{color:#91ecd5}
  .bottom{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:14px}.bottom small{color:#789bb3;font-size:11px}.reset{border:1px solid #38566c;background:transparent;color:#a9c4d8;border-radius:9px;padding:8px 12px;font-size:12px!important}.reset:hover{background:#1c3d51}
  .toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,15px);z-index:99;background:#effff9;color:#133e43;border:1px solid #a3e6d6;border-radius:14px;padding:12px 16px;font-size:13px;font-weight:750;box-shadow:0 14px 45px #0008;opacity:0;pointer-events:none;transition:.2s;max-width:90vw;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}
  @media(max-width:780px){#snowline{padding:14px 10px 30px}.layout{grid-template-columns:1fr}.stats{grid-template-columns:repeat(3,minmax(0,1fr))}.stat{min-height:72px;padding:11px}.stat-value{font-size:18px}.stat:nth-child(4),.stat:nth-child(5){display:block}.mountain{min-height:0;padding:10px 8px}.map-grid{gap:3px;margin-top:15px}.tile{border-radius:6px}.tile .tile-icon{font-size:clamp(15px,5vw,27px)}.map-foot{margin-top:13px}.top{margin-bottom:12px}.brand-name{font-size:20px}}
</style>
</head>
<body>
<div id="snowline"></div>
<script>
(function(){
'use strict';
const el=document.getElementById('snowline');
const COLS=9,ROWS=7;
const TYPES={lift:{name:'Подъёмник',icon:'🚠',price:60000,tip:'Ставит подъёмник на горном склоне. Вместимость: 240 гостей/день.'},blue:{name:'Синяя трасса',icon:'🔵',price:22000,tip:'Простая трасса для новичков. Добавляет 160 мест/день.'},red:{name:'Красная трасса',icon:'🔴',price:30000,tip:'Трасса для опытных лыжников. Добавляет 190 мест/день.'},lodge:{name:'Отель',icon:'🏨',price:38000,tip:'Размещается у подножия, привлекает больше туристов.'},snow:{name:'Снежные пушки',icon:'❄️',price:25000,tip:'Помогают поддерживать снег на склонах.'}};
const fmt=n=>new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0}).format(n);
const saveKey='snowline_v1_local_save';
function start(){return {day:1,money:185000,snow:82,rep:46,total:0,ticket:59,weather:'sun',temperature:-4,selected:'lift',map:{},log:['Добро пожаловать! Построй подъёмник и трассу, чтобы открыть курорт.'],last:0,won:false}}
function load(){try{let x=JSON.parse(localStorage.getItem(saveKey));return x&&typeof x.day==='number'&&x.map?Object.assign(start(),x):start()}catch{return start()}}
let s=load();let toastTimer;
function store(){try{localStorage.setItem(saveKey,JSON.stringify(s))}catch{}}
function cellKind(x,y){if((y===0&&(x===0||x===1||x===4||x===7||x===8))||(y===1&&(x===0||x===8))||(y===2&&(x===0))||(y===3&&x===8))return 'rock';if(y===0)return 'ridge';if(y===6)return 'base';return 'slope'}
const weatherNames={sun:'☀️ Ясно',cloud:'☁️ Облачно',snow:'🌨️ Снегопад',storm:'🌬️ Метель'};
function counts(){let c={lift:0,blue:0,red:0,lodge:0,snow:0};Object.values(s.map).forEach(t=>{if(t in c)c[t]++});return c}
function valid(type,x,y){let kind=cellKind(x,y);if(s.map[`${x}-${y}`])return false;if(type==='lodge')return kind==='base';return (kind==='slope'||kind==='ridge')&&!(type==='snow'&&y===0)}
function notify(msg){let t=document.querySelector('#snowline-toast');if(!t)return;t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2700)}
function render(){let c=counts(),operational=c.lift>0&&(c.blue+c.red)>0,skiing=operational&&s.snow>=20;let prog=Math.min(100,Math.round(s.total/1500*100));
let tileHtml='';for(let y=0;y<ROWS;y++){for(let x=0;x<COLS;x++){let k=cellKind(x,y),type=s.map[`${x}-${y}`],can=valid(s.selected,x,y),isRun=type==='blue'||type==='red',skiers=skiing&&isRun?`<span class="ski-run" aria-hidden="true"><span class="skier" style="--delay:-${((x*7+y*3)%10)/2}s"><i class="skier-body"></i></span>${(x+y)%3===0?`<span class="skier" style="--delay:-${1+((x*3+y*5)%8)/2}s"><i class="skier-body"></i></span>`:''}</span>`:'';tileHtml+=`<button class="tile ${k} ${type?'built '+type:''} ${can?'selected-buildable':''}" data-x="${x}" data-y="${y}" aria-label="${type?TYPES[type].name:'Пустая клетка '+(k==='base'?'у подножия':'на горе')}" title="${type?TYPES[type].name:k==='rock'?'Скала':k==='base'?'Подножие горы':'Горный склон'}">${type?`<span class="tile-icon">${TYPES[type].icon}</span>${skiers}`:(k==='rock'?'<span class="base-mark">◆</span>':k==='base'?'<span class="base-mark">♧</span>':'')}</button>`}}
let tools=Object.entries(TYPES).map(([key,t])=>`<button class="tool ${s.selected===key?'chosen':''}" data-tool="${key}" ${s.money<t.price?'disabled':''} title="${t.tip}"><span class="tool-icon">${t.icon}</span><span><div class="tool-title">${t.name}</div><div class="tool-cost">€${fmt(t.price)}</div></span></button>`).join('');
el.innerHTML=`<div class="top"><div class="brand"><div class="logo">🏔️</div><div><div class="brand-name">SNOWLINE</div><div class="brand-sub">Твой первый горнолыжный курорт • v1.0</div></div></div><div class="pill">📅 День ${s.day} &nbsp;·&nbsp; ${weatherNames[s.weather]} &nbsp;·&nbsp; ${s.temperature}°C</div></div>
<div class="stats"><div class="stat"><div class="stat-label">Бюджет</div><div class="stat-value">€${fmt(s.money)}</div><div class="stat-hint">${s.last>0?'+':''}${s.last===0?'Начальный капитал':'€'+fmt(s.last)+' за день'}</div></div><div class="stat"><div class="stat-label">Снег на склонах</div><div class="stat-value">${s.snow} см</div><div class="stat-hint">${s.snow>=50?'Отличные условия':s.snow>=22?'Можно кататься':'Мало снега'}</div></div><div class="stat"><div class="stat-label">Репутация</div><div class="stat-value">${s.rep}<span style="font-size:12px;color:#94b8cb"> / 100</span></div><div class="stat-hint">${s.rep>=70?'Популярный курорт':s.rep>=50?'Растёт известность':'Новый курорт'}</div></div><div class="stat"><div class="stat-label">Всего туристов</div><div class="stat-value">${fmt(s.total)}</div><div class="stat-hint">Цель: 1 500</div></div><div class="stat"><div class="stat-label">Сегодня на курорте</div><div class="stat-value">${operational?'Открыт':'Закрыт'}</div><div class="stat-hint">${c.lift} 🚠 &nbsp; ${c.blue+c.red} 🎿 &nbsp; ${c.lodge} 🏨</div></div></div>
<div class="layout"><section class="panel"><div class="panel-h"><div><div class="panel-title">🏔️ Гора Северный Пик</div><div class="eyebrow">Выбери постройку справа и нажми на свободную клетку</div></div><div class="small-tag">9 × 7 клеток</div></div><div class="mountain"><div class="map-grid">${tileHtml}</div><div class="map-foot"><span>▲ Вершина · 2 900 м</span><span>▼ База · 1 500 м</span></div></div><div class="action-area"><div class="instruction">${!operational?'💡 Для первых посетителей нужны хотя бы <b>1 подъёмник</b> и <b>1 трасса</b>.':s.snow<20?'⚠️ Снега слишком мало. Построй снежные пушки или дождись снегопада.':'✅ Курорт работает! Проживи день, получи доход и развивай инфраструктуру.'}</div><button class="button-primary" data-action="next">▶ ПРОЖИТЬ ДЕНЬ &nbsp; →</button></div></section>
<aside class="panel"><div class="panel-h"><div><div class="panel-title">🏗️ Строительство</div><div class="eyebrow">Выбери объект, затем место на карте</div></div></div><div class="shop"><div class="tools">${tools}</div></div><div class="hint"><b>${TYPES[s.selected].name}:</b> ${TYPES[s.selected].tip}</div><div class="subpanel"><div class="subheading">🎫 Цена ски-пасса</div><div class="ticket"><div><div class="ticket-value">€${s.ticket}</div><div style="font-size:10px;color:#8daac0;margin-top:2px">Дороже = меньше гостей</div></div><div class="stepper"><button data-action="minus" aria-label="Уменьшить цену">−</button><button data-action="plus" aria-label="Увеличить цену">+</button></div></div></div><div class="subpanel"><div class="mission"><div><div class="subheading">🏆 Первая цель</div><div class="mission-copy">Прими 1 500 гостей и достигни репутации 65.</div></div><div style="font-size:13px;font-weight:800;color:#76e5d3">${prog}%</div></div><div class="progress"><div style="width:${prog}%"></div></div><div style="color:#8faec5;font-size:11px;margin-top:8px">Репутация: ${s.rep} / 65 ${s.won?'· 🎉 Цель достигнута!':''}</div></div><div class="feed"><div class="feed-title">📋 События курорта</div>${s.log.slice(0,3).map((m,i)=>`<div class="feed-row">${m}</div>`).join('')}</div></aside></div>
<div class="bottom"><small>Учебная игра • Всё работает локально в браузере • Прогресс сохраняется в этом браузере, если разрешено</small><button class="reset" data-action="reset">↻ Начать заново</button></div>`;
store();}
function advance(){let c=counts(),open=c.lift>0&&(c.blue+c.red)>0,guests=0,profit=0;
if(open&&s.snow>=20){let cap=Math.min(c.lift*240,c.blue*160+c.red*190);let demand=(170+c.lodge*95)*(0.72+s.rep/95)*(s.weather==='sun'?1.1:s.weather==='cloud'?.93:s.weather==='snow'?.82:.62)*Math.max(.35,1-(s.ticket-59)*.012);guests=Math.round(Math.min(cap,demand)*(s.snow<38?.7:1));let income=guests*(s.ticket+3*c.lodge);let expense=c.lift*1050+(c.blue+c.red)*350+c.lodge*600+c.snow*850+guests*7;profit=Math.round(income-expense);s.rep=Math.max(0,Math.min(100,s.rep+(guests>=90?2:1)-(s.snow<38?2:0)));s.total+=guests;s.log.unshift(`<strong>День ${s.day}:</strong> ${guests} гостей, ${profit>=0?'прибыль':'убыток'} €${fmt(Math.abs(profit))}.`)}else if(open){let expense=c.lift*1050+(c.blue+c.red)*350+c.lodge*600+c.snow*850;profit=-expense;s.rep=Math.max(0,s.rep-2);s.log.unshift(`<strong>День ${s.day}:</strong> трассы закрыты, мало снега. Убыток €${fmt(-profit)}.`)}else{s.log.unshift(`<strong>День ${s.day}:</strong> нет связки подъёмник + трасса, посетителей пока нет.`)}
s.money+=profit;s.last=profit;
let roll=Math.random();s.weather=roll<.4?'sun':roll<.68?'cloud':roll<.91?'snow':'storm';s.temperature=s.weather==='sun'?-2+Math.floor(Math.random()*6):s.weather==='cloud'?-5+Math.floor(Math.random()*6):s.weather==='snow'?-7+Math.floor(Math.random()*4):-11+Math.floor(Math.random()*5);
let delta=s.weather==='sun'?-(4+Math.max(0,s.temperature)*4):s.weather==='cloud'?-2:s.weather==='snow'?14:24;delta+=c.snow*6;s.snow=Math.max(0,Math.min(180,s.snow+delta));s.day++;
if(!s.won&&s.total>=1500&&s.rep>=65){s.won=true;s.log.unshift('🎉 Победа! Ты построил успешный курорт. Но можно продолжать!')}
render();if(s.won&&s.total-guests<1500)notify('🏆 Цель выполнена! Северный Пик стал популярным!');else if(s.money<0)notify('⚠️ Касса в минусе. Проверь расходы и стоимость ски-пасса.');else if(guests>0)notify(`${guests} туристов! ${profit>=0?'+':''}€${fmt(profit)} за день`)}
el.addEventListener('click',ev=>{let tool=ev.target.closest('[data-tool]');if(tool){s.selected=tool.dataset.tool;render();return}let tile=ev.target.closest('[data-x]');if(tile){let x=+tile.dataset.x,y=+tile.dataset.y,k=`${x}-${y}`,t=TYPES[s.selected];if(!valid(s.selected,x,y)){notify(s.map[k]?'Эта клетка уже занята.':s.selected==='lodge'?'Отель можно построить только у подножия.':'Выбери свободный склон, а не скалу или базу.');return}if(s.money<t.price){notify('Недостаточно средств для строительства.');return}s.money-=t.price;s.map[k]=s.selected;s.log.unshift(`🏗️ Построено: ${t.name} (−€${fmt(t.price)}).`);render();notify(`Готово! ${t.name} построен.`);return}let action=ev.target.closest('[data-action]');if(!action)return;switch(action.dataset.action){case 'next':advance();break;case 'minus':s.ticket=Math.max(29,s.ticket-5);render();break;case 'plus':s.ticket=Math.min(119,s.ticket+5);render();break;case 'reset':if(confirm('Начать курорт заново? Текущий прогресс будет удалён.')){s=start();render();notify('Курорт начат заново.')}break}});
render();
})();
</script>
<div class="toast" id="snowline-toast" aria-live="polite"></div>
</body>
